# A sample workflow which checks out the code, builds a container
# image using Docker and scans that image for vulnerabilities using
# Snyk. The results are then uploaded to GitHub Security Code Scanning
#
# For more examples, including how to limit scans to only high-severity
# issues, monitor images for newly disclosed vulnerabilities in Snyk and
# fail PR checks for new vulnerabilities, see https://github.com/snyk/actions/

name: Snyk Container
on: push
permissions:
  contents: read
  security-events: write
jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build a Docker image
      run: docker build -t mpast/mobile_audit:latest .
    - name: Run Snyk to check Docker image for vulnerabilities
      # Snyk can be used to break the build when it detects vulnerabilities.
      # In this case we want to upload the issues to GitHub Code Scanning
      continue-on-error: true
      uses: snyk/actions/docker@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
      env:
        # In order to use the Snyk Action you will need to have a Snyk API token.
        # More details in https://github.com/snyk/actions#getting-your-snyk-token
        # or you can signup for free at https://snyk.io/login
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: mpast/mobile_audit:latest
        args: --file=Dockerfile
    - name: Remove invalid optional Snyk SARIF fixes
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path

        report = Path("snyk.sarif")
        if not report.is_file():
            raise SystemExit("Snyk did not generate snyk.sarif; check the scan output.")

        sarif = json.loads(report.read_text())
        removed = 0
        for run in sarif.get("runs", []):
            for result in run.get("results", []):
                if "fixes" not in result:
                    continue
                valid_fixes = []
                for fix in result["fixes"]:
                    invalid = any(
                        "text" in replacement.get("insertedContent", {})
                        and not isinstance(replacement["insertedContent"]["text"], str)
                        for change in fix.get("artifactChanges", [])
                        for replacement in change.get("replacements", [])
                    )
                    if invalid:
                        removed += 1
                    else:
                        valid_fixes.append(fix)
                result["fixes"] = valid_fixes

        Path("snyk.normalized.sarif").write_text(json.dumps(sarif, indent=2) + "\n")
        print(f"Removed {removed} invalid optional SARIF fixes; findings preserved.")
        PY
    - name: Upload result to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: snyk.normalized.sarif
